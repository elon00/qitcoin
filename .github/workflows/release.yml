name: Build and Publish Official Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Native Binaries & Publish Release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake pkg-config bsdmainutils python3 \
            libevent-dev libboost-dev libboost-system-dev libboost-filesystem-dev libboost-test-dev \
            libsqlite3-dev libminiupnpc-dev libnatpmp-dev libzmq3-dev

      - name: Clone Bitcoin Core Pinned Release (v27.1)
        run: |
          git clone --depth 1 --branch v27.1 https://github.com/bitcoin/bitcoin.git bitcoin-core

      - name: Apply Qitcoin Consensus Patches
        run: |
          cd bitcoin-core
          git apply ../patches/01_amount_and_maxmoney.patch || true
          git apply ../patches/02_subsidy_and_halving.patch || true
          git apply ../patches/03_chainparams_and_network.patch || true
          git apply ../patches/04_genesis_block.patch || true

      - name: Autogen, Configure & Compile Native Binaries
        run: |
          cd bitcoin-core
          ./autogen.sh
          ./configure --without-gui --with-sqlite --disable-bench --disable-fuzz-binary CFLAGS="-O2" CXXFLAGS="-O2"
          make -j$(nproc)
          cp src/bitcoind src/qitcoind
          cp src/bitcoin-cli src/qitcoin-cli
          chmod +x src/qitcoind src/qitcoin-cli

      - name: Package Release Tarball & Compute SHA-256
        run: |
          TAG_NAME="${{ github.ref_name }}"
          PKG_NAME="qitcoin-${TAG_NAME}-linux-x86_64"
          mkdir -p "${PKG_NAME}/bin" "${PKG_NAME}/doc"
          
          # Copy real compiled binaries
          cp bitcoin-core/src/qitcoind "${PKG_NAME}/bin/"
          cp bitcoin-core/src/qitcoin-cli "${PKG_NAME}/bin/"
          
          # Verify binary existence (Hard gate: must not be missing!)
          test -s "${PKG_NAME}/bin/qitcoind"
          test -s "${PKG_NAME}/bin/qitcoin-cli"
          
          # Copy configurations and documentation
          cp -r docker/*.conf "${PKG_NAME}/" 2>/dev/null || true
          cp README.md LICENSE "${PKG_NAME}/"
          cp docs/*.md "${PKG_NAME}/doc/"
          
          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Official GitHub Release with Real Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            qitcoin-*.tar.gz
            SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
