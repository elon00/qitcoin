name: Test Native 3-Node Cluster

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-cluster:
    name: Native 3-Node Docker Cluster Integration Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Start 3-Node Cluster
        run: |
          echo "Building native qitcoind container and starting 3-node cluster..."
          docker compose up -d --build
          echo "Waiting up to 45 seconds for nodes to initialize..."
          for i in {1..45}; do
            if curl -s --user qtcadmin:secure_qtc_password_2026 --data-binary '{"jsonrpc": "1.0", "id":"initcheck", "method": "getblockchaininfo", "params": [] }' -H 'content-type: text/plain;' http://127.0.0.1:19332/ | grep -q "result"; then
              echo "Node 1 RPC ready after ${i}s"
              break
            fi
            sleep 1
          done
          docker compose ps

      - name: Check Cluster Logs
        run: |
          docker compose logs --tail=50

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Strict 3-Node Functional Test Suite
        run: |
          python test/functional/test_qitcoin_3nodes.py
